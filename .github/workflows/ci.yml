name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e './backend[dev]'

      - name: Ruff
        run: ruff check backend scripts

      - name: Pytest
        run: pytest -q backend/tests

  terraform-static:
    name: Terraform static validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform/stage2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.0'
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init without backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate -no-color

  docker-build:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: regintel-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
